name: Build and Deploy on Tag

on:
  push:
    tags:
      - '*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG
        id: set-tag
        run: |
          echo "image-tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/namahlzeit-backend:${{ steps.set-tag.outputs.image-tag }}
            ${{ secrets.REGISTRY }}/namahlzeit-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./Frontend
          file: ./Frontend/frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/namahlzeit-frontend:${{ steps.set-tag.outputs.image-tag }}
            ${{ secrets.REGISTRY }}/namahlzeit-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Deploying tag: ${{ github.ref_name }}"
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}
            export REGISTRY=${{ secrets.REGISTRY }}
            ./scripts/deploy.sh

# Notes:
# - Define repository secrets: REGISTRY, REGISTRY_USER, REGISTRY_TOKEN,
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_PORT (optional), DEPLOY_PATH.
# - Ensure your `docker-compose.yml` references images using the variables,
#   e.g. `image: ${REGISTRY}/namahlzeit-backend:${IMAGE_TAG}` so `docker compose pull`
#   pulls the correct tag on the server.